version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: aoba-postgres
    environment:
      POSTGRES_DB: aoba
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - aoba_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aoba-redis
    ports:
      - "6379:6379"
    volumes:
      - aoba_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aoba_pgdata:
  aoba_redis:
